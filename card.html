<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business card design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/card.css">
</head>
<body>
    <div class="card">
        <div class="card-img border-blue">
            <img class="avatar" src="./images/per.png" alt="per Harald Borgen smiling at the camera with a colorful background">
        </div>
        
        <div class="text_card">
            <h3>Per Harald Borgen</h3>
            <p>Front End Developper</p>
            <h4>Oslo, Norway</h4>
        </div>
        
    </div>
    
</body>
</html>
